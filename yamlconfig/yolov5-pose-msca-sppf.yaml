# Ultralytics YOLOv5-pose (适配 YOLOv8 框架运行)
# Parameters
nc: 1 # 类别数
kpt_shape: [9, 3] # [关键点数量, 维度]

# Scales (对应 yolov5n/s/m/l/x)
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]

# Backbone 
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 6, 2, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 3, C3, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8
  - [-1, 6, C3, [256]]            # 4-P3 features
  - [-1, 1, Conv, [512, 3, 2]]    # 5-P4/16
  - [-1, 9, C3, [512]]            # 6-P4 features
  - [-1, 1, Conv, [768, 3, 2]]    # 7-P5/32 (原汁原味 768)
  - [-1, 3, C3, [768]]            # 8 (原汁原味 768)
  - [-1, 1, SPPF, [1024, 5]]      # 9

  # === 唯一直插点: SPPF 之后 ===
  - [-1, 1, MSCA, [32]]           # 10 (紧跟在 SPPF 后面，处理深层空间特征)

# Head
head:
  - [-1, 1, Conv, [512, 1, 1]]    # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]]     # 13 cat backbone P4 (第6层是骨干P4)
  - [-1, 3, C3, [512, False]]     # 14

  - [-1, 1, Conv, [256, 1, 1]]    # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]]     # 17 cat backbone P3 (第4层是骨干P3)
  - [-1, 3, C3, [256, False]]     # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]    # 19
  - [[-1, 15], 1, Concat, [1]]    # 20 cat head P4 (连接第15层Conv)
  - [-1, 3, C3, [512, False]]     # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]    # 22
  - [[-1, 11], 1, Concat, [1]]    # 23 cat head P5 (连接第11层Conv)
  - [-1, 3, C3, [1024, False]]    # 24 (P5/32-large)

  # Pose 检测头 (18对应P3, 21对应P4, 24对应P5)
  - [[18, 21, 24], 1, Pose, [nc, kpt_shape]] # 25 Pose(P3, P4, P5)
